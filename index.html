<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LOLA JACOBO</title>
  <style>
    :root{
      --bg: #0f0e17;
      --card: #ffffff;
      --text: #4b4b4b;
      --muted: #bfc0c0;
      --primary: #8a5cff;
      --primary-2: #b06fff;
      --accent: #22d1ee;
      --whatsapp: #25D366;

      /* Escalas base para móvil */
      --font-base: 72px;       /* texto base más grande */
      --font-btn: 120px;        /* tamaño de texto en botones */
      --font-title-min: 156px;  /* título mínimo */
      --icon-size: 200px;       /* iconos más grandes */
      --btn-pad-y: 72px;       /* padding vertical botones */
      --btn-pad-x: 700px;       /* padding horizontal botones */
      --btn-radius: 72px;      /* radios más redondeados */
      --links-gap: 72;       /* separación entre botones */
      --container-pad: 96px;   /* padding del contenedor */
      --tap-min: 192px;         /* área mínima táctil recomendada */
    }
    [data-theme="light"]{
      --bg: #f7f7fb;
      --card: #000000;
      --text: #ffffff;
      --muted: #5a5a6a;
      --primary: #7a5cff;
      --primary-2: #a47dff;
      --accent: #0bbbd6;
      --whatsapp: #22c55e;
    }

    *{ box-sizing: border-box; }
    html, body{ height: 100%; }
    body{
      margin:0;
      background: radial-gradient(1200px 600px at 10% 0%, rgba(138,92,255,.15), transparent),
                  radial-gradient(1200px 600px at 90% 100%, rgba(34,209,238,.12), transparent),
                  var(--bg);
      color: var(--text);
      font-family: 'Poppins', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      font-size: var(--font-base);
      -webkit-tap-highlight-color: transparent; /* mejor UX táctil */
    }

    .container{
      max-width: 560px;
      margin: 0 auto;
      padding: var(--container-pad);
      padding-bottom: calc(var(--container-pad) + env(safe-area-inset-bottom, 0px));
      position: relative;
    }

    .bg-decor{
      position: fixed;
      inset: -20%;
      pointer-events: none;
      filter: blur(60px);
      opacity: .45;
    }
    .bg-decor-1{
      background: radial-gradient(600px 400px at 15% 20%, rgba(138,92,255,.25), transparent);
    }
    .bg-decor-2{
      background: radial-gradient(600px 400px at 85% 80%, rgba(34,209,238,.22), transparent);
    }

    .profile{
      display:flex;
      align-items:center;
      flex-direction:column;
      gap: 16px;
      margin: 36px 0 24px;
    }
    .avatar-wrapper{
      width: 140px; height:140px; /* más grande en móvil */
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    .avatar{
      width: 100%; height: 100%;
      border-radius: 50%;
      display:block;
      object-fit: cover;
      background: #ddd;
    }
    .name{
      font-size: clamp(var(--font-title-min), 6vw, 32px);
      font-weight: 700;
      letter-spacing: .2px;
      margin: 0;
      text-align:center;
    }
    .subtitle{
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      text-align:center;
    }

    .links{
      display: grid;
      gap: var(--links-gap);
      margin-top: 22px;
    }
    .btn{
      display:flex;
      align-items:center;
      gap: 16px;
      padding: var(--btn-pad-y) var(--btn-pad-x);
      min-height: var(--tap-min);          /* asegura área táctil 48px */
      border-radius: var(--btn-radius);
      background: var(--card);
      color: var(--text);
      text-decoration:none;
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: 0 8px 18px rgba(0,0,0,.18);
      transition: transform .12s ease, box-shadow .12s ease, background .2s ease;
      font-size: var(--font-btn);
      line-height: 1.25;
      touch-action: manipulation;           /* mejora respuesta táctil */
    }
    .btn:hover{ transform: translateY(-1px); box-shadow: 0 12px 24px rgba(0,0,0,.22); }
    .btn:active{ transform: translateY(0); }

    .btn .icon{ font-size: var(--icon-size); }

    .btn-primary{
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      border: none;
      color: #fff;
    }
    .btn-gradient{
      background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af, #515bd4);
      border: none;
      color: #fff;
    }
    .btn-whatsapp{
      background: var(--whatsapp);
      color: #fff;
      border: none;
    }
    .btn-secondary{
      background: var(--card);
    }

    .footer{
      display:flex;
      justify-content:center;
      margin-top: 28px;
    }
    .tiny-btn{
      background: transparent;
      border: 1px solid rgba(0,0,0,.12);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      min-height: var(--tap-min);
    }

    /* Mejora aún más en pantallas medianas y grandes */
    @media (min-width: 520px){
      :root{
        --font-base: 18px;
        --font-btn: 20px;
        --icon-size: 28px;
        --btn-pad-y: 20px;
        --btn-pad-x: 24px;
        --btn-radius: 20px;
        --links-gap: 20px;
      }
      .avatar-wrapper{ width: 150px; height: 150px; }
      .name{ font-size: clamp(28px, 4vw, 36px); }
    }

    /* Dispositivos muy pequeños (360px o menos): aumentamos contraste y espacio */
    @media (max-width: 360px){
      :root{
        --font-base: 36px;
        --font-btn: 38px;
        --icon-size: 48px;
        --btn-pad-y: 36px;
        --btn-pad-x: 36px;
        --links-gap: 32px;
      }
      .container{ padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>
<main class="container">
  <header class="profile">
    <div class="avatar-wrapper">
      <img id="avatar" class="avatar" src="lola.jpg" alt="Foto de Mamá" />
    </div>
    <h1 id="displayName" class="name">LOLA JACOBO</h1>
    <p class="subtitle">LA VOZ MAS SEXY DE LA RADIO</p>
  </header>

  <section class="links">
    <a class="btn btn-primary" id="btnFacebook" href="#" target="_blank" rel="noopener">
      <span class="icon"></span>
      <span>Facebook</span>
    </a>

    <a class="btn btn-gradient" id="btnInstagram" href="#" target="_blank" rel="noopener">
      <span class="icon"></span>
      <span>Instagram</span>
    </a>

    <a class="btn btn-whatsapp" id="btnWhatsapp" href="#" target="_blank" rel="noopener">
      <span class="icon"></span>
      <span>WhatsApp</span>
    </a>

    <a class="btn btn-secondary" id="btnTiktok" href="#" target="_blank" rel="noopener">
      <span class="icon"></span>
      <span>TikTok</span>
    </a>

    <a class="btn btn-secondary" id="btnWeb" href="#" target="_blank" rel="noopener">
      <span class="icon"></span>
      <span>Sitio Web</span>
    </a>
  </section>

  <footer class="footer">
    <button id="toggleTheme" class="tiny-btn" aria-label="Cambiar tema">Cambiar tema</button>
  </footer>
</main>

<script>
  // ====== MODIFICA AQUÍ TUS DATOS RÁPIDO ======
  const SOCIAL_LINKS = {
    facebook: "https://www.facebook.com/lo.jach.1/",
    instagram: "https://www.instagram.com/lola_jach/?hl=es",
    whatsapp: "https://wa.me/523411702230",
    tiktok: "https://www.tiktok.com/@lolajach",
    web: "https://tusitio.com"
  };

  const PROFILE = {
    name: "LOLA JACOBO",
    photoUrl: "" // ejemplo: "https://mi-cdn.com/foto.jpg"
  };
  // ============================================

  // Aplica links y datos
  function applyProfile(){
    const map = [
      { id: "btnFacebook", key: "facebook" },
      { id: "btnInstagram", key: "instagram" },
      { id: "btnWhatsapp", key: "whatsapp" },
      { id: "btnTiktok", key: "tiktok" },
      { id: "btnWeb", key: "web" },
    ];

    map.forEach(({ id, key }) => {
      const a = document.getElementById(id);
      if (a && SOCIAL_LINKS[key]) a.href = SOCIAL_LINKS[key];
    });

    if (PROFILE.name) {
      const d = document.getElementById("displayName");
      if (d) d.textContent = PROFILE.name;
    }
    if (PROFILE.photoUrl) {
      const avatar = document.getElementById("avatar");
      if (avatar) avatar.src = PROFILE.photoUrl;
    }
  }

  // Tema claro/oscuro
  const root = document.documentElement;
  const KEY = "preferred-theme";

  function applyTheme(theme){
    if(theme === "light"){
      root.setAttribute("data-theme", "light");
    } else {
      root.removeAttribute("data-theme");
    }
    try { localStorage.setItem(KEY, theme); } catch(e){}
  }

  function initTheme(){
    try{
      const saved = localStorage.getItem(KEY);
      if(saved){ applyTheme(saved); return; }
    }catch(e){}
    const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    applyTheme(prefersLight ? "light" : "dark");
  }

  // Inicializa todo
  document.addEventListener("DOMContentLoaded", () => {
    initTheme();
    applyProfile();
    document.getElementById("toggleTheme")?.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
      applyTheme(current === "light" ? "dark" : "light");
    });
  });
</script>
</body>

</html>
